<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/budgeting-ross/favicon.svg" />
    <!-- viewport-fit=cover: serve perché env(safe-area-inset-*) restituisca valori veri
         sugli iPhone con notch/Dynamic Island, altrimenti resta sempre 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colora la barra di Safari in tinta con l'app; il valore giusto lo imposta lo script
         qui sotto, perché il tema è una scelta salvata e non prefers-color-scheme. -->
    <meta name="theme-color" content="#ffffff" />
    <title>Budgeting Ross</title>
    <script>
      // Applica il tema prima del primo paint: senza questo, chi ha il tema scuro
      // vedrebbe un lampo bianco finché React non monta e non applica la classe.
      (function () {
        try {
          var saved = localStorage.getItem('budgeting-ross-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0a0a0a');
          }
        } catch (e) {
          /* localStorage non disponibile: resta il tema chiaro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
